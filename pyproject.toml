[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-pattern-checker"
version = "0.1.0"
description = "Crochet Pattern Verification, Visualization & PDF Publishing Engine"
requires-python = ">=3.10"
dependencies = [
    "PyPDF2>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0","pydantic>=2.0", "click>=8.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
crochet-check = "crochet_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Production correctness lint gate.
filterwarnings = [
    "ignore:.*httpx.*starlette.*:DeprecationWarning",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PIE"]
ignore = [
    "E501",
    "F401",
    "F841",
    "B008",
    "BLE001",
    "S110",
    "SIM102",
    "SIM103",
    "SIM115",
    "RUF012",
    "RUF013",
    "RUF022",
    "DTZ001",
    "DTZ005",
    "DTZ007",
    "EXE001",
    "EXE002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "SIM115"]
"src/crochet_checker/__init__.py" = ["F401"]
"src/crochet_checker/**/__init__.py" = ["F401"]

[tool.coverage.run]
source = ["src/crochet_checker"]
omit = [
    "src/crochet_checker/features/*",
    "src/crochet_checker/agents/*",
    "src/crochet_checker/cli.py",
    "src/crochet_checker/utils/enhanced_pdf.py",
    "src/crochet_checker/generator/*",
    "src/crochet_checker/marketplace/*",
    "src/crochet_checker/library/*",
    "src/crochet_checker/pricing/*",
    "src/crochet_checker/testing/*",
    "src/crochet_checker/ai_enhanced/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70
show_missing = true
skip_covered = false
