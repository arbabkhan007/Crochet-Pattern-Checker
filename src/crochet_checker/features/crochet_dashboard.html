<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crochet Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            color: #666;
            font-size: 1.1em;
            margin-top: 5px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .chart-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        canvas { max-height: 300px; }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧶 Crochet Analytics Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">5</div>
                <div class="stat-label">Projects Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">150.0</div>
                <div class="stat-label">Hours Spent</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">5730</div>
                <div class="stat-label">Yards of Yarn Used</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">$265.00</div>
                <div class="stat-label">Total Yarn Investment</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">5</div>
                <div class="stat-label">Skills Mastered</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📊 Projects by Category</div>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">📈 Monthly Progress</div>
                <canvas id="monthlyChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">🎯 Difficulty Distribution</div>
                <canvas id="difficultyChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">🧶 Top Yarn Brands (by yards)</div>
                <canvas id="yarnChart"></canvas>
            </div>
        </div>
        
        <div class="footer">
            <p>Generated on September 12, 2026 at 01:53 AM</p>
        </div>
    </div>
    
    <script>
        // Category Chart
        new Chart(document.getElementById('categoryChart'), {
            type: 'doughnut',
            data: {
                labels: ["Blankets", "Toys", "Accessories", "Baby", "Garments"],
                datasets: [{
                    data: [1, 1, 1, 1, 1],
                    backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a']
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        // Monthly Chart
        new Chart(document.getElementById('monthlyChart'), {
            type: 'line',
            data: {
                labels: ["2026-09"],
                datasets: [{
                    label: 'Projects',
                    data: [5],
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    tension: 0.4
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        
        // Difficulty Chart
        new Chart(document.getElementById('difficultyChart'), {
            type: 'bar',
            data: {
                labels: ["Intermediate", "Beginner", "Advanced"],
                datasets: [{
                    label: 'Projects',
                    data: [1, 2, 2],
                    backgroundColor: ['#43e97b', '#4facfe', '#fa709a']
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        
        // Yarn Brands Chart
        new Chart(document.getElementById('yarnChart'), {
            type: 'bar',
            data: {
                labels: ["Red Heart", "Lily Sugar'n Cream", "Malabrigo"],
                datasets: [{
                    label: 'Yards Used',
                    data: [5000, 1200, 800],
                    backgroundColor: '#764ba2'
                }]
            },
            options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
